  name: flask-service
  labels:
    name: flask-service
    app: flask-app
    project: K8-project
spec:
  type: NodePort
  selector:
    name: flask-pod
    app: flask-app
    project: K8-project
   
  ports:
    - port: 6000
      targetPort: 6000
      nodePort: 30000
